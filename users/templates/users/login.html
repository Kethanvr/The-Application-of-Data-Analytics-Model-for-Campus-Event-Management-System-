{% extends 'users/base.html' %}
{% block title %}Login - CEMS{% endblock %}
{% block content_full %}
<div class="min-vh-100 d-flex align-items-center justify-content-center"
    style="background: linear-gradient(135deg, #0C2340 0%, #1a4a7a 100%);">
    <div class="card" style="width: 420px; border-radius: 16px;">
        <div class="card-body p-5">
            <div class="text-center mb-4">
                <i class="fas fa-calendar-check fa-3x text-primary mb-3"></i>
                <h3 class="font-weight-bold">CEMS</h3>
                <p class="text-muted">Campus Event Management System</p>
            </div>
            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label><i class="fas fa-user mr-1"></i> Username</label>
                    <input type="text" name="username" class="form-control form-control-lg" placeholder="Enter username"
                        required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-lock mr-1"></i> Password</label>
                    <input type="password" name="password" class="form-control form-control-lg"
                        placeholder="Enter password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-lg btn-block mt-3">
                    <i class="fas fa-sign-in-alt mr-2"></i>Login
                </button>
            </form>
            <div class="text-center mt-3">
                <a href="{% url 'register' %}" class="text-muted">Don't have an account? <strong>Register</strong></a>
            </div>
            <div class="text-center mt-2">
                <a href="/admin/" class="text-muted small">Admin Panel</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
