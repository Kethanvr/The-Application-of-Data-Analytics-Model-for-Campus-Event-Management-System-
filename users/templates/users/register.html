{% extends 'users/base.html' %}
{% block title %}Register - CEMS{% endblock %}
{% block content_full %}
<div class="min-vh-100 d-flex align-items-center justify-content-center py-4 px-3"
    style="background: linear-gradient(135deg, #0C2340 0%, #1a4a7a 100%);">
    <div class="card w-100" style="max-width: 520px; border-radius: 16px;">
        <div class="card-body p-5">
            <div class="text-center mb-4">
                <i class="fas fa-user-plus fa-3x text-primary mb-3"></i>
                <h3 class="font-weight-bold">Create Account</h3>
                <p class="text-muted">Join the Campus Event Management System</p>
            </div>
            <form method="post">
                {% csrf_token %}
                <div class="form-row">
                    <div class="form-group col-md-6">
                        <label>First Name</label>
                        <input type="text" name="first_name" class="form-control" placeholder="First name">
                    </div>
                    <div class="form-group col-md-6">
                        <label>Last Name</label>
                        <input type="text" name="last_name" class="form-control" placeholder="Last name">
                    </div>
                </div>
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" name="username" class="form-control" placeholder="Choose a username" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" class="form-control" placeholder="Email address">
                </div>
                <div class="form-group">
                    <label>Role</label>
                    <select name="role" class="form-control" required>
                        {% for value, label in roles %}
                        <option value="{{ value }}">{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label>Department</label>
                    <select name="department" class="form-control">
                        <option value="">-- Select Department --</option>
                        {% for value, label in departments %}
                        <option value="{{ value }}">{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-row">
                    <div class="form-group col-md-6">
                        <label>Password</label>
                        <input type="password" name="password1" class="form-control" required>
                    </div>
                    <div class="form-group col-md-6">
                        <label>Confirm Password</label>
                        <input type="password" name="password2" class="form-control" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-lg btn-block mt-2">
                    <i class="fas fa-user-plus mr-2"></i>Register
                </button>
            </form>
            <div class="text-center mt-3">
                <a href="{% url 'login' %}" class="text-muted">Already have an account? <strong>Login</strong></a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
